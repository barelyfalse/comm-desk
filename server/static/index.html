<style>
/* fonts are served by the app itself (Fontsource variable builds, OFL), no third-party requests */

<style>
/* Layout: sticky ops bar · scannable case ledger · case workspace in two columns (record left, activity right) */
:root{
  --bg:#f1f3f7; --surface:#ffffff; --surface-2:#f7f8fb; --line:#dce0e8; --line-strong:#c5cbd6;
  --fg:#151a24; --muted:#5b6476; --faint:#8a92a3;
  --accent:#2b4fd8; --accent-fg:#ffffff; --accent-soft:#e7ecfd;
  --over:#c33a2a; --over-soft:#fbe8e5; --today:#c0660d; --today-soft:#fdeedd; --tmrw:#8f7400; --tmrw-soft:#faf3d2; --later:#5b6476;
  /* due-state palette for the ledger: red overdue, yellow today, green tomorrow, light blue 2+ days */
  --due-over:#ba4848; --due-today:#b89321; --due-tmrw:#3f8c56; --due-later:#619bc9;
  --due-over-fg:#ae4040; --due-today-fg:#856917; --due-tmrw-fg:#307244; --due-later-fg:#417dad;
  --code-bg:#f2f4f9; --mark:#dfe7ff; --mark-fg:#1c3aa8; --td-part:#1f7ab8; --td-cancel:#9a2b20;
  --font-ui:"Public Sans",system-ui,-apple-system,"Segoe UI",sans-serif;
  --font-mono:"JetBrains Mono",ui-monospace,"SFMono-Regular",Menlo,Consolas,monospace;
  --r:8px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0e1218; --surface:#151a23; --surface-2:#1a2030; --line:#252c3a; --line-strong:#343d4f;
  --fg:#e5e8ee; --muted:#9aa2b3; --faint:#6d7587;
  --accent:#7f9cff; --accent-fg:#0b1020; --accent-soft:#1c2542;
  --over:#d8958d; --over-soft:#2a2023; --today:#d4a777; --today-soft:#29231d; --tmrw:#c8b778; --tmrw-soft:#26251d; --later:#9aa2b3;
  --due-over:#db7d77; --due-today:#d5b657; --due-tmrw:#6cb883; --due-later:#8ebde0;
  --due-over-fg:var(--due-over); --due-today-fg:var(--due-today); --due-tmrw-fg:var(--due-tmrw); --due-later-fg:var(--due-later);
  --code-bg:#0b0f15; --mark:#22305c; --mark-fg:#c4d2ff; --td-part:#7cc4f5; --td-cancel:#a8706a; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0e1218; --surface:#151a23; --surface-2:#1a2030; --line:#252c3a; --line-strong:#343d4f;
  --fg:#e5e8ee; --muted:#9aa2b3; --faint:#6d7587;
  --accent:#7f9cff; --accent-fg:#0b1020; --accent-soft:#1c2542;
  --over:#d8958d; --over-soft:#2a2023; --today:#d4a777; --today-soft:#29231d; --tmrw:#c8b778; --tmrw-soft:#26251d; --later:#9aa2b3;
  --due-over:#db7d77; --due-today:#d5b657; --due-tmrw:#6cb883; --due-later:#8ebde0;
  --due-over-fg:var(--due-over); --due-today-fg:var(--due-today); --due-tmrw-fg:var(--due-tmrw); --due-later-fg:var(--due-later);
  --code-bg:#0b0f15; --mark:#22305c; --mark-fg:#c4d2ff; --td-part:#7cc4f5; --td-cancel:#a8706a; color-scheme:dark}

*{box-sizing:border-box}
body{background:var(--bg);color:var(--fg);font-family:var(--font-ui);font-size:14px;line-height:1.45}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--surface)}
.mono{font-family:var(--font-mono);font-variant-numeric:tabular-nums}
a{color:var(--accent)}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
h1,h2{margin:0;text-wrap:balance}
h1{font-size:22px;font-weight:700;letter-spacing:-.01em}
h2{font-size:11px;font-weight:600;text-transform:uppercase;letter-spacing:.08em;color:var(--muted)}

/* top bar */
.bar{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--surface);border-bottom:1px solid var(--line);
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.bar-in{max-width:1240px;margin:0 auto;display:flex;align-items:center;gap:20px;height:52px}
.brand{font-weight:700;letter-spacing:-.01em;display:flex;align-items:center;gap:8px;text-decoration:none;color:var(--fg)}
.brand svg{width:22px;height:22px;display:block;flex:none}
.brand .lg-b{fill:var(--accent)}
.brand .lg-l{stroke:var(--accent-fg)}
.brand .lg-d{fill:var(--tmrw)}
.nav{display:flex;gap:4px;flex:1}
.nav a{text-decoration:none;color:var(--muted);padding:6px 10px;border-radius:6px;font-weight:500}
.nav a[aria-current="page"]{color:var(--fg);background:var(--surface-2)}
.nav a:hover{color:var(--fg)}

.wrap{padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:20px 60px}
.page{max-width:1240px;margin:0 auto;display:flex;flex-direction:column;gap:16px}

/* controls */
.btn{border:1px solid var(--line-strong);background:var(--surface);border-radius:6px;padding:7px 12px;cursor:pointer;font-weight:500;white-space:nowrap}
.btn:hover{border-color:var(--muted)}
a.btn{text-decoration:none}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-fg)}
.btn.primary:hover{filter:brightness(1.08)}
.btn.sm{padding:4px 9px;font-size:12.5px}
.btn.ghost{border-color:transparent;background:transparent;color:var(--muted)}
.btn.ghost:hover{color:var(--fg);background:var(--surface-2)}
.btn.danger{color:var(--over);border-color:color-mix(in srgb,var(--over) 40%,transparent)}
.btn.danger.solid{background:var(--over);color:var(--surface);border-color:var(--over)}
.x{border:0;background:none;cursor:pointer;color:var(--faint);padding:2px 4px;border-radius:4px;line-height:1}
.x:hover{color:var(--over);background:var(--over-soft)}
input[type=text],input[type=search],input[type=url],input[type=date],select,textarea{
  width:100%;border:1px solid var(--line);background:var(--surface-2);border-radius:6px;padding:7px 9px;min-width:0}
input:focus,select:focus,textarea:focus{border-color:var(--accent);outline:none;background:var(--surface)}
textarea{resize:vertical;line-height:1.5}
label.f{display:flex;flex-direction:column;gap:4px;font-size:12px;color:var(--muted);font-weight:500;min-width:0}

/* home */
.toolbar{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}
.toolbar h1{display:flex;align-items:baseline;gap:8px}
.count{font-size:14px;color:var(--faint);font-weight:500}
.tb-r{display:flex;gap:8px;flex:1;justify-content:flex-end;min-width:260px}
.tb-r input{max-width:340px}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:12.5px;color:var(--muted)}
.legend span{display:flex;align-items:center;gap:6px}
.legend b{font-weight:600;color:var(--fg)}
.dot{width:8px;height:8px;border-radius:50%;display:inline-block}
.banner{display:flex;gap:12px;align-items:center;justify-content:space-between;flex-wrap:wrap;background:var(--accent-soft);border-radius:var(--r);padding:10px 14px;font-size:13px}

.ledger{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);overflow-x:auto}
.lrow{display:grid;grid-template-columns:124px minmax(220px,1fr) 128px 132px 132px 180px;
  gap:12px;align-items:center;padding:10px 14px 10px 11px;border-left:3px solid transparent;min-width:1022px;color:inherit}
.lrow[data-href]{cursor:pointer}
.lrow+.lrow{border-top:1px solid var(--line)}
.lrow[data-href]:hover{background-color:var(--surface-2)}
.lhead{font-size:11px;text-transform:uppercase;letter-spacing:.07em;color:var(--faint);font-weight:600;padding-block:9px;background:var(--surface-2)}
.lrow.s-over{border-left-color:var(--due-over)} .lrow.s-today{border-left-color:var(--due-today)} .lrow.s-tmrw{border-left-color:var(--due-tmrw)} .lrow.s-later{border-left-color:var(--due-later)}
/* a 5% tint at the left edge, gone by 40% of the row; 2+ days keeps just the border */
.lrow.s-over{background-image:linear-gradient(90deg,color-mix(in srgb,var(--due-over) 5%,transparent),transparent 40%)}
.lrow.s-today{background-image:linear-gradient(90deg,color-mix(in srgb,var(--due-today) 5%,transparent),transparent 40%)}
.lrow.s-tmrw{background-image:linear-gradient(90deg,color-mix(in srgb,var(--due-tmrw) 5%,transparent),transparent 40%)}
.c-num{display:flex;align-items:center;gap:6px;min-width:0}
.c-num .mono{font-weight:600;font-size:13px}
/* ledger: number + complexity on line 1, tags on line 2; title on line 1, notes on line 2 */
.lrow .c-num{flex-direction:column;align-items:flex-start;gap:3px}
.c-id{display:flex;align-items:center;gap:8px;min-width:0;max-width:100%;min-height:20px}
.c-tags{display:flex;gap:4px;flex-wrap:nowrap;overflow:hidden;max-width:100%;min-height:18px}
.c-tags .chip{flex:none;display:block;line-height:16px;white-space:nowrap}
.c-tags.fit .chip:first-child{flex:0 1 auto;min-width:0;overflow:hidden;text-overflow:ellipsis}
.c-tags .chip.more{background:transparent;box-shadow:inset 0 0 0 1px var(--line);color:var(--muted)}
.cxm{font-family:var(--font-mono);font-size:11px;font-weight:500;color:var(--faint);flex:none}
.num-copy{border:0;background:none;padding:2px 3px;margin:-2px -3px;border-radius:4px;cursor:copy;color:inherit;text-align:left;max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.num-copy:hover{background:var(--accent-soft);color:var(--mark-fg)}
.num-copy:disabled{cursor:default;background:none;color:inherit}
.case-head .num-copy{font-size:13px;font-weight:500;color:var(--muted)}
.case-head .num-copy:hover{color:var(--mark-fg)}
.ib.cp{margin-left:auto;width:26px;height:26px;opacity:.55;border-color:transparent;background:transparent}
.lrow:hover .ib.cp,.ib.cp:focus-visible{opacity:1;border-color:var(--line);background:var(--surface)}
.c-main{min-width:0;display:flex;flex-direction:column;gap:3px}
.c-name{font-weight:600;color:var(--fg);text-decoration:none;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.c-name:hover{text-decoration:underline}
.c-name{line-height:20px}
.c-notes{color:var(--muted);font-size:12.5px;line-height:18px;min-height:18px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;min-width:0}
.c-phase,.c-last,.c-next,.c-auto{display:flex;flex-direction:column;gap:2px;min-width:0}
.cell{padding:4px 6px;font-size:12.5px;background:transparent;border-color:transparent;border-radius:5px;cursor:pointer}
.lrow:hover .cell{border-color:var(--line);background:var(--surface)}
.cell:focus{border-color:var(--accent);background:var(--surface)}
select.cell{font-weight:500}
.c-last .sub,.c-next .due{padding-left:7px;font-size:11.5px}
.c-auto{padding-left:2px}
.ac{font-size:12.5px;font-weight:600;white-space:nowrap}
.ac.k-set,.ac.k-sent{color:var(--later);font-weight:500}
.ac.k-email{color:var(--today)} .ac.k-late,.ac.k-close{color:var(--over)}
.ac.k-stale{color:var(--faint);font-weight:500;text-decoration:line-through}
.ch-status .ac{padding:2px 8px;border-radius:99px;border:1px solid currentColor;font-size:12px}
.sub{font-size:12px;color:var(--faint)}
.empty{padding:40px 16px;text-align:center;color:var(--muted)}

.pill{display:inline-block;padding:2px 8px;border-radius:99px;background:var(--surface-2);border:1px solid var(--line);font-size:12px;font-weight:500;white-space:nowrap;max-width:100%;overflow:hidden;text-overflow:ellipsis}
.due{font-size:12.5px;font-weight:600;white-space:nowrap}
.due.k-over{color:var(--due-over-fg)} .due.k-today{color:var(--due-today-fg)} .due.k-tmrw{color:var(--due-tmrw-fg)} .due.k-later{color:var(--due-later-fg);font-weight:500} .due.k-none{color:var(--faint);font-weight:400}
.chips{display:flex;gap:4px;flex-wrap:wrap}
.chip{font-family:var(--font-mono);font-size:11.5px;font-weight:500;padding:1px 7px;border-radius:4px;background:var(--accent-soft);color:var(--mark-fg);display:inline-flex;align-items:center;gap:4px}
.chip .x{color:inherit;opacity:.6;font-size:13px;padding:0 2px}

.dates{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}
.opt{font-weight:400;color:var(--faint)}
.ac-note{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;font-size:13px;padding:9px 12px;border-radius:6px;background:var(--surface-2);border:1px solid var(--line);color:var(--muted)}
.ac-note b{color:var(--fg);font-weight:600}
.ac-note.k-email{background:var(--today-soft);border-color:color-mix(in srgb,var(--today) 40%,transparent)}
.ac-note.k-late,.ac-note.k-close{background:var(--over-soft);border-color:color-mix(in srgb,var(--over) 40%,transparent)}

@media (max-width:760px){
  .ledger{overflow:visible;background:transparent;border:0;display:flex;flex-direction:column;gap:8px}
  .lhead{display:none}
  .lrow{min-width:0;background:var(--surface);border:1px solid var(--line);border-left-width:3px;border-radius:var(--r);
    grid-template-columns:repeat(2,minmax(0,1fr));grid-template-areas:"num auto" "main main" "phase phase" "last next";gap:8px 10px;padding:10px 12px}
  .lrow.s-none{border-left-color:var(--line)}
  .lrow+.lrow{border-top:1px solid var(--line)}
  .c-num{grid-area:num}.c-main{grid-area:main}.c-phase{grid-area:phase}.c-last{grid-area:last}.c-next{grid-area:next}
  .c-auto{grid-area:auto;align-items:flex-end;text-align:right}.c-auto>.sub:only-child{display:none}
  .c-name{white-space:normal}
  .c-notes{white-space:normal}
  .c-tags{flex-wrap:wrap}
  .c-tags:empty,.c-notes:empty{display:none}
  .cell{border-color:var(--line);background:var(--surface-2)}
  .c-last::before{content:"Last comm";font-size:11px;color:var(--faint)}
  .c-next::before{content:"Next comm";font-size:11px;color:var(--faint)}
  .ib.cp{opacity:1;width:36px;height:36px}
  .tb-r{min-width:100%}.tb-r input{max-width:none}
  .dates{grid-template-columns:minmax(0,1fr)}
}

/* case page */
.back{text-decoration:none;color:var(--muted);font-size:13px;font-weight:500;align-self:flex-start}
.back:hover{color:var(--fg)}
.case-head{display:flex;justify-content:space-between;align-items:flex-end;gap:16px;flex-wrap:wrap;padding-bottom:4px}
.case-head .num{font-size:13px;color:var(--muted);font-weight:500}
.case-head h1{font-size:24px;margin-top:2px}
.ch-status{display:flex;gap:10px;align-items:center}
.case-grid{display:grid;grid-template-columns:minmax(0,1.45fr) minmax(0,1fr);gap:16px;align-items:start}
.col{display:flex;flex-direction:column;gap:16px;min-width:0}
.case-grid.one{grid-template-columns:minmax(0,1fr)}
@media (max-width:900px){.case-grid{grid-template-columns:minmax(0,1fr)}}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px 16px;display:flex;flex-direction:column;gap:12px;min-width:0}
.p-head{display:flex;justify-content:space-between;align-items:center;gap:8px;min-height:24px}
.form{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px 12px}
.form .wide{grid-column:1/-1}
@media (max-width:480px){.form{grid-template-columns:minmax(0,1fr)}}
.hint{font-size:12.5px;color:var(--muted);margin:0;max-width:70ch}
:root[data-hints="off"] .hint{display:none}
.hint code,.code-inline{font-family:var(--font-mono);font-size:12px;background:var(--code-bg);padding:1px 5px;border-radius:4px}

/* log */
.log-in{display:flex;gap:8px}
.log{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;max-height:360px;overflow-y:auto}
.log li{display:grid;grid-template-columns:minmax(0,1fr) auto;grid-template-areas:"time x" "t x";gap:2px 10px;padding:8px 0;border-top:1px solid var(--line);align-items:start}
.log li:first-child{border-top:0}
.log time{grid-area:time;font-family:var(--font-mono);font-size:11px;color:var(--faint)}
.log .t{grid-area:t;min-width:0;overflow-wrap:anywhere}
.log .x{grid-area:x;align-self:center}
.log li.auto .t{color:var(--muted);font-size:13px;display:flex;align-items:center;gap:6px}
.log li.auto .t::before{content:"";width:6px;height:6px;border-radius:50%;background:var(--accent);flex:none}
.log li.empty-li{display:block}
.log .x{visibility:hidden}.log li:hover .x,.log li:focus-within .x{visibility:visible}
.muted-empty{color:var(--faint);font-size:13px}

/* tags / links / vars */
.inline-add{display:flex;gap:8px}
.links{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:2px}
.links li{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:4px 0}
.links a{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-weight:500;text-decoration:none}
.links a:hover{text-decoration:underline}
.link-add{display:grid;grid-template-columns:minmax(0,.8fr) minmax(0,1.2fr) auto;gap:8px}
.vars{display:flex;flex-direction:column;gap:6px}
.vrow{display:grid;grid-template-columns:minmax(0,.8fr) minmax(0,1.2fr) auto;gap:8px;align-items:center}
.vrow input{font-family:var(--font-mono);font-size:12.5px}
.vrow .fk{color:var(--accent)}

/* commands in case */
.pin-row{display:flex;gap:8px;align-items:center}
.pin-row select{flex:1}
.cmd{border:1px solid var(--line);border-radius:var(--r);overflow:hidden;min-width:0}
.cmd-top{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:9px 12px;background:var(--surface-2);border-bottom:1px solid var(--line)}
.cmd-top b{font-weight:600}
.cmd-vars{display:grid;grid-template-columns:repeat(auto-fill,minmax(180px,1fr));gap:8px;padding:10px 12px}
.cmd-vars:empty{display:none}
.cmd-vars label{font-family:var(--font-mono);font-size:11.5px}
.cmd-vars label .src{font-family:var(--font-ui);color:var(--faint);font-weight:400}

<script>
(function(){
const LS='casedesk.v1';
/* hints: a per-device display preference, so it lives in this browser rather than in the case data */
const HINTS='commdesk.hints';
function applyHints(on){document.documentElement.dataset.hints=on?'on':'off';const b=document.getElementById('set-hints');if(b)b.checked=on}
function setHints(on){applyHints(on);try{localStorage.setItem(HINTS,on?'on':'off')}catch(e){}}
const hintsOn=()=>document.documentElement.dataset.hints!=='off';
try{applyHints(localStorage.getItem(HINTS)!=='off')}catch(e){applyHints(true)}
const PHASES=['Waiting','Update','Follow Up','Closing soon','Closing'];
const PHASE_MAP={'Future update':'Update','INCRUP':'Update','Waiting response':'Waiting','48-h follow up':'Follow Up','Closing tomorrow':'Closing soon','Waiting closing':'Waiting'};
const PH=/\{([A-Za-z_][\w.\-]*)\}/g;
const app=document.getElementById('app');
let state, cur=null, ui={q:''};

/* ---------- utils ---------- */
const h=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const uid=()=>Math.random().toString(36).slice(2,9);
const iso=d=>`${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;
const addDays=n=>{const d=new Date();d.setDate(d.getDate()+n);return iso(d)};
const WDS=['Sun','Mon','Tue','Wed','Thu','Fri','Sat'];
const MON=['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
function pd(s){const[y,m,d]=s.split('-').map(Number);return new Date(y,m-1,d)}
function fmt(s){if(!s)return '';const d=pd(s);return `${MON[d.getMonth()]} ${d.getDate()}`}
function diff(s){const t=new Date();t.setHours(0,0,0,0);return Math.round((pd(s)-t)/864e5)}
function due(c){
  if(!c.commDate)return{k:'none',label:'No date'};
  const d=diff(c.commDate);
  if(d<0)return{k:'over',label:`Overdue ${-d}d`};
  if(d===0)return{k:'today',label:'Today'};
  if(d===1)return{k:'tmrw',label:'Tomorrow'};
  return{k:'later',label:`In ${d}d`};
}
const KEEP_DAYS=15;
function closedInfo(c){const since=-diff(c.closedAt);const left=KEEP_DAYS-since;return{since,left,ready:left<=0}}
function archiveUpsert(c){const a=state.archive.find(x=>x.id===c.id&&!x.reopenedAt);const e={id:c.id,number:c.number,name:c.name,closedAt:c.closedAt};if(c.sample)e.sample=true;if(a)Object.assign(a,e);else state.archive.push(e)}
function archiveReopen(c){const a=state.archive.filter(x=>x.id===c.id&&!x.reopenedAt).pop();if(a)a.reopenedAt=iso(new Date())}
const autoLog=(c,text)=>c.log.unshift({t:Date.now(),text,auto:true});
function stamp(ts){const d=new Date(ts);return `${WDS[d.getDay()]}, ${MON[d.getMonth()]} ${d.getDate()} · ${String(d.getHours()).padStart(2,'0')}:${String(d.getMinutes()).padStart(2,'0')}`}
let tt;function toast(m){const t=document.getElementById('toast');t.textContent=m;t.classList.add('on');clearTimeout(tt);tt=setTimeout(()=>t.classList.remove('on'),1600)}

/* ---------- storage ----------
   The server holds the data. Every change calls save(), which waits until edits pause for SAVE_DELAY ms,
   then sends the whole state with the version it was based on. The server refuses a stale version (409),
   which is how a newer save from another tab or device is caught instead of overwritten.
   Until the server confirms, the state is also kept in localStorage, so a dropped tunnel or an expired
   sign-in loses nothing: the next load sends it again. */
const SAVE_DELAY=600,PENDING=LS+'.unsaved';
/* snapshot: ask the server to keep a copy of what it has before this save replaces it (restore, overwrite) */
const sync={version:0,dirty:false,inflight:null,timer:0,wait:0,conflict:null,savedAt:0,snapshot:false,sent:[]};
/* sent: saves that went out but never got an answer (the tab closed, or the network dropped mid-request).
   Each is {base, hash}. If the server's data is exactly one of them, that save landed, so a newer server
   version is our own write and not a conflict. */
function hashStr(s){let a=0xdeadbeef,b=0x41c6ce57;for(let i=0;i<s.length;i++){const c=s.charCodeAt(i);a=Math.imul(a^c,2654435761);b=Math.imul(b^c,1597334677)}
  a=Math.imul(a^(a>>>16),2246822507)^Math.imul(b^(b>>>13),3266489909);b=Math.imul(b^(b>>>16),2246822507)^Math.imul(a^(a>>>13),3266489909);
  return (4294967296*(2097151&b)+(a>>>0)).toString(36)}
function landed(version,raw,sent){if(!sent||!sent.length)return false;const h=hashStr(raw);return sent.some(x=>version===x.base+1&&x.hash===h)}
async function api(method,path,body){
  const r=await fetch(path,{method,body,credentials:'same-origin',cache:'no-store',
    headers:body?{'Content-Type':'application/json'}:{},
    keepalive:!!body&&body.length<60000}); /* lets the last save finish when the tab closes */
  if(r.status===401){location.href='/login';throw new Error('signed out')}
  return r;
}
function keepLocal(){try{localStorage.setItem(PENDING,JSON.stringify({base:sync.version,state,sent:sync.sent}))}catch(e){}}
function dropLocal(){try{localStorage.removeItem(PENDING)}catch(e){}}
function readLocal(){try{return JSON.parse(localStorage.getItem(PENDING))}catch(e){return null}}
function save(){
  sync.dirty=true;keepLocal();clearTimeout(sync.timer);
  if(sync.conflict)return;
  setStatus(sync.wait?'error':'saving');
  sync.timer=setTimeout(flush,SAVE_DELAY);
}
function flush(force){
  clearTimeout(sync.timer);
  if(sync.inflight||!sync.dirty||(sync.conflict&&!force))return sync.inflight||Promise.resolve();
  sync.dirty=false;setStatus('saving');
  const snap=sync.snapshot,data=JSON.stringify(state);
  /* a forced save has no base version, so it can't be matched later; it's only used after a conflict anyway */
  const attempt=force?null:{base:sync.version,hash:hashStr(data)};
  if(attempt){sync.sent.push(attempt);if(sync.sent.length>3)sync.sent.shift();keepLocal()}
  const body=`{"version":${force?'null':sync.version},"snapshot":${!!snap},"data":${data}}`;
  sync.inflight=(async()=>{
    try{
      const r=await api('PUT','/api/state',body);
      sync.sent=sync.sent.filter(x=>x!==attempt); /* the server answered, so this attempt's outcome is known */
      if(r.status===409){
        sync.dirty=true;
        if(await rebaseIfLanded())return; /* the 409 came from an earlier save of ours that did land */
        showConflict('This data was saved from another tab or device after you opened it.',null);return}
      if(!r.ok)throw new Error('HTTP '+r.status);
      const d=await r.json();sync.version=d.version;sync.savedAt=d.savedAt*1000;sync.wait=0;sync.sent=[];if(snap)sync.snapshot=false;
      if(sync.dirty)keepLocal();else dropLocal();
    }catch(e){sync.dirty=true;sync.wait=Math.min(sync.wait?sync.wait*2:2000,30000)}
    finally{
      sync.inflight=null;
      if(sync.conflict)setStatus('conflict');
      else if(sync.dirty){setStatus(sync.wait?'error':'saving');sync.timer=setTimeout(flush,sync.wait||SAVE_DELAY)}
      else setStatus('saved');
    }
  })();
  return sync.inflight;
}
async function rebaseIfLanded(){
  if(!sync.sent.length)return false;
  try{const r=await api('GET','/api/state');if(!r.ok)return false;const d=await r.json();
    if(!landed(d.version,JSON.stringify(d.data),sync.sent))return false;
    sync.version=d.version;sync.savedAt=(d.savedAt||0)*1000;sync.sent=[];sync.wait=0;return true}
  catch(e){return false}
}
async function reload(){
  const r=await api('GET','/api/state');if(!r.ok)throw new Error('HTTP '+r.status);
  const d=await r.json();
  sync.version=d.version;sync.savedAt=(d.savedAt||0)*1000;state=normState(d.data||sample());
  setStatus('saved');route();
}
/* coming back to the tab: pick up saves made elsewhere, unless this tab has its own unsaved edits */
async function checkRemote(){
  if(!state||sync.dirty||sync.inflight||sync.conflict)return;
  try{const {version}=await (await api('GET','/api/state/version')).json();
    if(version!==sync.version&&!sync.dirty&&!sync.inflight){await reload();toast('Updated with newer saved data')}}catch(e){}
}
function showConflict(msg,mine){
  sync.conflict={mine};clearTimeout(sync.timer);
  document.getElementById('sync-msg').textContent=msg;document.getElementById('sync-banner').hidden=false;setStatus('conflict');
}
function clearConflict(){sync.conflict=null;document.getElementById('sync-banner').hidden=true}
async function useTheirs(){clearConflict();sync.dirty=false;dropLocal();try{await reload();toast('Loaded the saved data')}catch(e){setStatus('error')}}
function useMine(){const m=sync.conflict.mine;clearConflict();if(m){state=normState(m);route()}sync.dirty=true;sync.snapshot=true;keepLocal();flush(true)}
const SYNC_ICON={
  saved:'<svg viewBox="0 0 16 16" aria-hidden="true"><path d="M3.5 8.5l3 3 6-7" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg>',
  saving:'<svg class="spin" viewBox="0 0 16 16" aria-hidden="true"><circle cx="8" cy="8" r="5.5" fill="none" stroke="currentColor" stroke-opacity=".25" stroke-width="2"/><path d="M13.5 8A5.5 5.5 0 0 0 8 2.5" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>',
  error:'<svg viewBox="0 0 16 16" aria-hidden="true"><circle cx="8" cy="8" r="6" fill="none" stroke="currentColor" stroke-width="1.6"/><path d="M8 4.8v3.6" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/><circle cx="8" cy="11" r="1" fill="currentColor"/></svg>'};
SYNC_ICON.loading=SYNC_ICON.saving;SYNC_ICON.conflict=SYNC_ICON.error;
const SYNC_LABEL={loading:'Loading…',saving:'Saving…',saved:'Saved',error:'Not saved · retrying',conflict:'Not saved'};
function setStatus(s){
  const el=document.getElementById('sync');
  el.title=s==='saved'&&sync.savedAt?`Last saved ${stamp(sync.savedAt)}`:s==='error'?'Can’t reach the server. Click to retry now.':'';
  if(el.dataset.s===s&&el.innerHTML)return; /* keep the spinner running smoothly while typing */
  el.dataset.s=s;el.innerHTML=`${SYNC_ICON[s]}<span>${SYNC_LABEL[s]}</span>`;
}
async function boot(){
  setStatus('loading');app.innerHTML='<div class="boot">Loading…</div>';
  let d;
  try{const r=await api('GET','/api/state');if(!r.ok)throw new Error('HTTP '+r.status);d=await r.json()}
  catch(e){
    setStatus('error');
    app.innerHTML=`<div class="boot"><b>Can’t reach the Comm Desk server.</b><span>Check that the server is running and the SSH tunnel is open.</span><button class="btn" data-act="boot-retry">Try again</button></div>`;
    return;
  }
  const raw=JSON.stringify(d.data); /* before normState, which changes the data in place */
  sync.version=d.version;sync.savedAt=(d.savedAt||0)*1000;state=normState(d.data||sample());
  const p=readLocal();
  if(p&&p.state){
    /* identical to the server: the last save landed but the tab closed before it heard back */
    if(JSON.stringify(p.state)===raw)dropLocal();
    else if(p.base===d.version||landed(d.version,raw,p.sent)){state=normState(p.state);sync.dirty=true;flush();toast('Restored changes that weren’t saved')}
    else showConflict('Some changes from your last visit weren’t saved, and the server has newer data since.',p.state);
  }
  if(!sync.inflight&&!sync.conflict)setStatus('saved');
  route();
}
document.addEventListener('visibilitychange',()=>{if(document.visibilityState==='visible')checkRemote();else flush()});
window.addEventListener('beforeunload',e=>{if(sync.dirty||sync.inflight){flush();e.preventDefault();e.returnValue=''}});
function norm(c){if(PHASE_MAP[c.phase])c.phase=PHASE_MAP[c.phase];if(c.phase&&!PHASES.includes(c.phase))c.phase='';c.tags||=[];c.links||=[];c.fields||={};if(c.vars){for(const k in c.vars)if(!(k in c.fields)||c.fields[k]==='')c.fields[k]=c.vars[k];delete c.vars}c.commands||=[];c.hiddenCmds||=[];c.hiddenLinks||=[];c.linkIds||=[];c.hiddenVars||=[];c.log||=[];c.todos||=[];if(![1,2,3,4,5].includes(c.complexity))c.complexity=3;return c}
function migTpl(t){return (t||'').replace(/\{case\.(id|number)\}/g,'{caseId}').replace(/\{case\.name\}/g,'{caseName}').replace(/\{case\.([A-Za-z_][\w.\-]*)\}/g,'{$1}')}
/* case page panels; settings.layout says which column each one goes in, top to bottom */
const PANELS={case:'Case',notes:'Notes',vars:'Variables',cmds:'Commands',todo:'TODO',log:'Log',tags:'Tags',links:'Links'};
const LAYOUT0=[['case','notes','vars','cmds'],['todo','log','tags','links']];
function normLayout(l){
  const seen=new Set(),out=[[],[]];
  if(Array.isArray(l))l.slice(0,2).forEach((col,i)=>Array.isArray(col)&&col.forEach(k=>{if(PANELS[k]&&!seen.has(k)){seen.add(k);out[i].push(k)}}));
  LAYOUT0.forEach((col,i)=>col.forEach(k=>{if(!seen.has(k))out[i].push(k)})); /* panels added in a later version land in their usual column */
  return out;
}
function normState(s){s.archive||=[];s.cases||=[];s.commands||=[];s.globals||=[];s.commands.forEach(k=>k.template=migTpl(k.template));s.cases.forEach(norm);s.defaults||={};s.defaults.vars||=[];s.defaults.links||=[];
  /* default variables used to be on every case; ones saved before the "every case" switch existed keep that */
  s.defaults.vars.forEach(v=>{if(typeof v.auto!=='boolean')v.auto=true});
  /* same for default links: the ones saved before they could be picked per case stay on every case */
  s.defaults.links.forEach(l=>{if(typeof l.auto!=='boolean')l.auto=true});
  s.settings||={};s.settings.layout=normLayout(s.settings.layout);s.defaults.links.forEach(l=>{l.id||=('l'+uid());l.url=migTpl(l.url)});s.cases.forEach(c=>c.links.forEach(l=>l.url=migTpl(l.url)));s.cases.filter(c=>c.closedAt&&!s.archive.some(a=>a.id===c.id)).forEach(c=>s.archive.push({id:c.id,number:c.number,name:c.name,closedAt:c.closedAt,sample:c.sample||undefined}));return s}

function prevBizS(s){const[y,m,d]=s.split('-').map(Number);const x=new Date(y,m-1,d);do{x.setDate(x.getDate()-1)}while(x.getDay()===0||x.getDay()===6);return `${x.getFullYear()}-${String(x.getMonth()+1).padStart(2,'0')}-${String(x.getDate()).padStart(2,'0')}`}
function sample(){
  const now=Date.now(),H=36e5;
  const cmds=[
    {id:'k'+uid(),name:'Access request',auto:true,template:'access-tool request --case={caseId} --account={accountId} --hours={hours} --requester={username} --reason="{reason}"'},
    {id:'k'+uid(),name:'Service status',template:'admin-cli service status {service} --region={region} --account={accountId}'},
    {id:'k'+uid(),name:'Fetch logs',template:'admin-cli logs fetch {resource} --region={region} --account={accountId} | tail -n {lines}'}
  ];
  const cases=[
    {number:'10000001',name:'Product module update stuck at 60%',phase:'Update',commDate:addDays(0),lastComm:addDays(-2),
      notes:'Update job paused at step 3 of 5. Asked the customer for the job log.',tags:['Priority'],
      links:[{label:'Case notes',url:'https://example.com/notes/10000001'}],fields:{accountId:'acme-prod',service:'module-updater'},
      vars:{hours:'4',reason:'Review update job'},commands:[],
      log:[{t:now-26*H,text:'Customer shared the job log, paused on a lock'},{t:now-50*H,text:'Case assigned, first contact sent'}]},
    {number:'10000002',name:'Scheduled reports arriving late',phase:'Waiting',commDate:'',lastComm:addDays(-4),
      notes:'Delays start after 09:00. Asked the customer which reports are affected.',tags:[],
      links:[],fields:{accountId:'northwind-main',service:'reports',region:'eu-west'},vars:{},commands:[cmds[1].id],
      log:[{t:now-20*H,text:'Found a queue backlog on the reports worker'}]},
    {number:'10000003',name:'Sync between two environments failing',phase:'Follow Up',commDate:addDays(-1),lastComm:addDays(-4),
      notes:'Waiting on a specialist review. Promised an update by yesterday.',tags:['Priority','Escalated'],
      links:[{label:'Review thread',url:'https://example.com/threads/881'}],fields:{accountId:'fabrikam-sync'},vars:{},commands:[],log:[]},
    {number:'10000004',name:'Permission error when calling the API',phase:'Update',commDate:addDays(3),lastComm:addDays(0),
      notes:'User role is missing the required permission.',tags:[],links:[],fields:{accountId:'contoso-dev'},vars:{},commands:[],log:[]},
    {number:'10000005',name:'Dashboard errors after a configuration change',phase:'Closing soon',commDate:prevBizS(addDays(3)),lastComm:addDays(-2),autoClose:addDays(3),autoCloseSet:addDays(-2),
      notes:'Fixed by the customer. Closure notice sent, closing if no reply.',tags:[],links:[],fields:{accountId:'tailspin-web',region:'us-east'},vars:{},commands:[],log:[]}
    ,{number:'10000006',name:'Request to raise a usage limit',phase:'Closing',commDate:'',lastComm:addDays(-6),closedAt:addDays(-4),notes:'Limit raised.',tags:[],links:[],fields:{},commands:[],log:[]}
    ,{number:'10000007',name:'Export missing rows',phase:'Closing',commDate:'',lastComm:addDays(-20),closedAt:addDays(-16),notes:'',tags:[],links:[],fields:{},commands:[],log:[]}
  ].map(c=>norm({id:'c'+uid(),sample:true,...c}));
  const defaults={
    vars:[{key:'region',value:'us-east',auto:true},{key:'accountId',value:'',auto:true},{key:'ticketRef',value:'',auto:false}],
    links:[
      {id:'l'+uid(),label:'Case in tracker',url:'https://tracker.example.com/case/{caseId}',auto:true},
      {id:'l'+uid(),label:'Account in admin console',url:'https://admin.example.com/accounts/{accountId}',auto:true},
      {id:'l'+uid(),label:'Service runbook',url:'https://wiki.example.com/runbooks/{service}',auto:false}
    ]};
  const globals=[{key:'username',value:'jdoe'},{key:'team',value:'support-l2'}];
  return{cases,commands:cmds,defaults,globals,sample:true};
}

/* ---------- placeholders ---------- */
function placeholders(tpl){const out=[],seen=new Set();for(const m of (tpl||'').matchAll(PH)){if(!seen.has(m[1])){seen.add(m[1]);out.push(m[1])}}return out}
const BUILTIN={caseId:1,caseName:1};
const defVar=k=>state.defaults.vars.find(v=>v.key===k);
function caseVal(c,k){const v=c.fields[k];if(v!==undefined&&v!=='')return v;return defVar(k)?.value??''}
const vkey=n=>n;
const gVar=k=>state.globals.find(v=>v.key===k);
function resolve(n,c){
  if(BUILTIN[n])return n==='caseName'?(c.name||''):(c.number||'');
  const g=gVar(n);if(g)return g.value||'';
  return caseVal(c,n);
}
/* every placeholder used on a case becomes a case variable */
function usedKeys(c){
  const out=new Map();
  const add=(tpl,src)=>placeholders(tpl).filter(p=>!BUILTIN[p]).forEach(p=>{const k=vkey(p);if(!out.has(k))out.set(k,new Set());out.get(k).add(src)});
  caseCmdIds(c).forEach(id=>{const k=getCmd(id);add(k.template,k.name||'Untitled command')});
  caseLibLinks(c).forEach(l=>add(l.url,l.label||'link'));
  c.links.forEach(l=>add(l.url,l.label||'link'));
  return out;
}
/* library links on this case: the "every case" ones it hasn't hidden, plus the ones picked for it */

const CLOSING_PHASES=['Closing soon','Closing'];
const WD=['Sun','Mon','Tue','Wed','Thu','Fri','Sat'];
const fmtW=s=>s?`${WD[pd(s).getDay()]}, ${fmt(s)}`:'';
function prevBiz(s){const d=pd(s);do{d.setDate(d.getDate()-1)}while(d.getDay()===0||d.getDay()===6);return iso(d)}
/* auto-close: two emails. The closing tomorrow email is due 1 business day before the auto-close date (phase Closing soon);
   the closing email is due on the auto-close date (phase Closing). sent = closing tomorrow email sent, done = closing email sent. */
function autoInfo(c){
  if(!c.autoClose)return null;
  const rem=prevBiz(c.autoClose),set=c.autoCloseSet||'',lc=c.lastComm||'';
  const stale=!CLOSING_PHASES.includes(c.phase);
  return{k:stale?'stale':'active',rem,done:!!c.cSent,sent:!!(c.cSent||c.ctSent||(lc&&set&&lc>set&&lc>=rem))};
}
/* auto-close drives Phase + Next comm: closing tomorrow email 1 business day before, closing email on the date */
function applyAuto(c){
  const a=autoInfo(c);if(!a)return;
  if(a.sent){c.phase='Closing';c.commDate=c.autoClose}else{c.phase='Closing soon';c.commDate=a.rem}
}
/* 48h follow up: Waiting + 2 business days since last comm. First one per case is required, later ones optional. */
function addBiz(s,n){const d=pd(s);let k=0;while(k<n){d.setDate(d.getDate()+1);if(d.getDay()!==0&&d.getDay()!==6)k++}return iso(d)}
function fuInfo(c){
  if(c.closedAt||!c.lastComm)return null;
  const due=addBiz(c.lastComm,2),n=c.fuCount||0;
  if(c.phase==='Follow Up')return{k:'due',due,n};
  if(c.phase==='Waiting'&&iso(new Date())>=due)return{k:n?'optional':'due',due,n};
  return null;
}
/* move Waiting cases whose first follow up is due into Follow Up */
function tickFU(){
  let changed=false;const today=iso(new Date());
  for(const c of state.cases){
    if(c.closedAt||c.phase!=='Waiting'||(c.fuCount||0)>0||!c.lastComm)continue;
    const due=addBiz(c.lastComm,2);if(today<due)continue;
    c.phase='Follow Up';if(!c.commDate||c.commDate>due)c.commDate=due;
    autoLog(c,`Follow up due: 2 business days since last comm (${fmt(c.lastComm)})`);changed=true;
  }
  if(changed)save();
}
function markFU(c,keepDate){
  if(!keepDate)c.lastComm=iso(new Date());
  c.fuCount=(c.fuCount||0)+1;c.phase='Waiting';c.commDate='';
  autoLog(c,`Follow up #${c.fuCount} sent`);
}
function fuOnLastComm(c){if(c.phase==='Follow Up'){markFU(c,true);return true}return false}
function lastCommChanged(c){
  if(!c.autoClose)return false;
  const a=autoInfo(c);
  if(a.k==='active'&&c.lastComm&&c.lastComm>=a.rem){ /* this is the closing tomorrow email, or the closing email */
    if(!c.ctSent){c.ctSent=true;c.phase='Closing';c.commDate=c.autoClose;autoLog(c,'Closing tomorrow email sent')}
    else if(!c.cSent&&c.lastComm>=c.autoClose){c.cSent=true;autoLog(c,'Closing email sent')}
    return false;
  }
  autoLog(c,`Auto-close ${fmtW(c.autoClose)} cleared by new last comm`);
  c.autoClose='';c.autoCloseSet='';c.ctSent=false;c.cSent=false;if(CLOSING_PHASES.includes(c.phase))c.phase='';return true;
}

function renderLayout(focus){
  const lay=state.settings.layout,names=['Left column','Right column'];
  document.getElementById('lay').innerHTML=lay.map((col,ci)=>`<div class="lay-col" data-col="${ci}"><div class="lay-h">${names[ci]}</div><ul class="lay-list">${col.map((k,i)=>`<li class="lay-item" draggable="true" data-p="${k}"><span class="grip">${GRIP}</span><span class="lay-name">${PANELS[k]}</span><span class="lay-btns">
      <button class="ib" data-act="lay-mv" data-p="${k}" data-d="up" ${i===0?'disabled':''} title="Move up" aria-label="Move ${PANELS[k]} up">${arrowSvg('up')}</button>
      <button class="ib" data-act="lay-mv" data-p="${k}" data-d="down" ${i===col.length-1?'disabled':''} title="Move down" aria-label="Move ${PANELS[k]} down">${arrowSvg('down')}</button>
      <button class="ib" data-act="lay-mv" data-p="${k}" data-d="${ci?'left':'right'}" title="Move to the ${ci?'left':'right'} column" aria-label="Move ${PANELS[k]} to the ${ci?'left':'right'} column">${arrowSvg(ci?'left':'right')}</button>
    </span></li>`).join('')}</ul></div>`).join('');
  document.getElementById('lay-reset').disabled=JSON.stringify(lay)===JSON.stringify(LAYOUT0);
  if(focus){const b=document.querySelector(`[data-act="lay-mv"][data-p="${focus.p}"][data-d="${focus.d}"]`);(b&&!b.disabled?b:document.querySelector(`.lay-item[data-p="${focus.p}"] .ib:not(:disabled)`))?.focus()}
}
function setLayout(l){const n=normLayout(l);if(JSON.stringify(n)===JSON.stringify(state.settings.layout))return false;state.settings.layout=n;save();return true}
function moveLayout(p,d){
  const l=state.settings.layout.map(c=>[...c]),ci=l.findIndex(c=>c.includes(p)),i=l[ci].indexOf(p);
  if(d==='up'&&i>0)[l[ci][i-1],l[ci][i]]=[l[ci][i],l[ci][i-1]];
  else if(d==='down'&&i<l[ci].length-1)[l[ci][i+1],l[ci][i]]=[l[ci][i],l[ci][i+1]];
  else if(d==='left'||d==='right'){l[ci].splice(i,1);l[1-ci].splice(Math.min(i,l[1-ci].length),0,p)}
  setLayout(l);renderLayout({p,d:d==='left'?'right':d==='right'?'left':d});
}
/* drag and drop: the dragged item moves through the lists live; the order is read back when it's dropped */
let drag=null;
app.addEventListener('dragstart',e=>{const li=e.target.closest?.('.lay-item');if(!li)return;drag=li;e.dataTransfer.effectAllowed='move';try{e.dataTransfer.setData('text/plain',PANELS[li.dataset.p])}catch(err){}requestAnimationFrame(()=>li.classList.add('dragging'))});
app.addEventListener('dragover',e=>{
  if(!drag)return;const col=e.target.closest('.lay-col');if(!col)return;
  e.preventDefault();e.dataTransfer.dropEffect='move';
  document.querySelectorAll('.lay-col.over').forEach(x=>x!==col&&x.classList.remove('over'));col.classList.add('over');
  const list=col.querySelector('.lay-list');
  const before=[...list.querySelectorAll('.lay-item:not(.dragging)')].find(el=>{const r=el.getBoundingClientRect();return e.clientY<r.top+r.height/2});
  if(before){if(before.previousElementSibling!==drag)list.insertBefore(drag,before)}else if(list.lastElementChild!==drag)list.appendChild(drag);
});
app.addEventListener('drop',e=>{if(drag)e.preventDefault()});
app.addEventListener('dragend',()=>{
  if(!drag)return;drag=null;
  const l=[...document.querySelectorAll('#lay .lay-list')].map(ul=>[...ul.children].map(li=>li.dataset.p));
  if(setLayout(l))toast('Layout saved');
  renderLayout();
});

const TD_NEXT={' ':'-','-':'d','d':'x','x':' '},TD_PREV={' ':'x','-':' ','d':'-','x':'d'};
const TD_NAME={' ':'To do','-':'Partly done','d':'Done','x':'Canceled'};
const tdList=()=>cur.todos;
function renderTodos(focus){
  const l=tdList(),open=l.filter(t=>t.s===' '||t.s==='-').length,gone=l.length-open;
  document.getElementById('td-count').textContent=l.length?`${open} open`:'';
  const b=document.getElementById('td-clear');b.disabled=!gone;b.textContent=`Clear done & canceled${gone?' · '+gone:''}`;
  document.getElementById('todos').innerHTML=l.length?l.map((t,i)=>`<li class="td" data-s="${t.s}">
    <button class="td-box mono" data-act="td-cycle" data-i="${i}" title="${TD_NAME[t.s]}. Click to change" aria-label="${TD_NAME[t.s]}. Change state">[${t.s}]</button>
    <input type="text" class="td-text" data-td="${i}" value="${h(t.text)}" aria-label="To-do" autocomplete="off">
    <button class="x" data-act="td-del" data-i="${i}" aria-label="Delete to-do">×</button></li>`).join(''):`<li class="muted-empty">No to-dos for this case.</li>`;
  if(focus!=null)document.querySelector(`.td-box[data-i="${focus}"]`)?.focus();
}
function addTodo(){const i=document.getElementById('td-new');const v=i.value.trim();if(!v)return;tdList().push({id:'t'+uid(),text:v,s:' '});i.value='';save();renderTodos();i.focus()}

/* ---------- routing ---------- */
function route(){
  const r=location.hash.slice(1);
  tickFU();
  refreshLists();
  const onCmds=r==='commands'||r.startsWith('command-');
  const sec=onCmds?'cmds':r==='variables'?'vars':r==='links'?'links':r==='settings'?'settings':'cases';
  document.querySelectorAll('[data-nav]').forEach(a=>a.dataset.nav===sec?a.setAttribute('aria-current','page'):a.removeAttribute('aria-current'));
  if(r.startsWith('case-'))renderCase(r.slice(5));
  else if(onCmds)renderCommands(r.startsWith('command-')?r.slice(8):null);
  else if(r==='variables')renderVariables();
  else if(r==='settings')renderSettings();
  else if(r==='links')renderLinksPage();
  else if(r==='history')renderHistory();
  else renderHome();
  window.scrollTo(0,0);
}

/* ---------- actions ---------- */
let rs;function resortSoon(){clearTimeout(rs);rs=setTimeout(()=>{const a=document.activeElement;if(a&&a.classList.contains('cell')){resortSoon();return}if(ui.dirty&&!cur&&document.getElementById('ledger')){ui.dirty=false;renderHome()}},700)}
app.addEventListener('focusout',e=>{if(e.target.classList?.contains('cell'))resortSoon()});
function addLog(){const i=document.getElementById('log-in');const v=i.value.trim();if(!v)return;cur.log.unshift({t:Date.now(),text:v});i.value='';save();renderLog();i.focus()}
function addTag(){const i=document.getElementById('tag-in');const v=i.value.trim();if(!v)return;if(!cur.tags.includes(v))cur.tags.push(v);i.value='';save();renderTags();refreshLists();i.focus()}
function addLink(){const l=document.getElementById('link-label'),u=document.getElementById('link-url');let url=u.value.trim();if(!url)return;if(!/^[a-z]+:\/\//i.test(url))url='https://'+url;cur.links.push({label:l.value.trim(),url});l.value='';u.value='';ensureVars(cur);save();renderLinks();renderVars();l.focus()}
function cleanKey(v){return v.trim().replace(/^\{|\}$/g,'').replace(/[^\w.\-]/g,'_')}
function addVar(){const i=document.getElementById('var-new');const k=cleanKey(i.value);if(!k)return;if(BUILTIN[k]){toast(`${k} comes from the case itself`);return}if(gVar(k)){toast(`${k} is a global variable`);return}if(defVar(k)){addDefVar(cur,k);toast(`Added the default variable ${k}`)}else if(!(k in cur.fields))cur.fields[k]='';i.value='';save();renderVars();refreshCmds();document.querySelector(`#vars .var[data-row="${CSS.escape(k)}"] input`)?.focus()}
function addDVar(){const i=document.getElementById('dvar-new');const k=cleanKey(i.value);if(!k)return;if(BUILTIN[k]){toast(`${k} comes from the case itself`);return}if(gVar(k)){toast(`${k} is already a global variable`);return}if(!defVar(k))state.defaults.vars.push({key:k,value:'',auto:false});i.value='';save();renderBank();document.querySelector(`#dvars .var[data-row="${CSS.escape(k)}"] input`)?.focus()}
function addGVar(){const i=document.getElementById('gvar-new');const k=cleanKey(i.value);if(!k)return;if(BUILTIN[k]){toast(`${k} comes from the case itself`);return}if(!gVar(k))state.globals.push({key:k,value:''});i.value='';save();renderBank();document.querySelector(`#gvars .var[data-row="${CSS.escape(k)}"] input`)?.focus()}
function copyText(text,el){
  const done=()=>toast('Copied');
  try{navigator.clipboard.writeText(text).then(done).catch(()=>fallback())}catch(e){fallback()}
  function fallback(){if(el){const r=document.createRange();r.selectNodeContents(el);const s=getSelection();s.removeAllRanges();s.addRange(r)}toast('Selected. Press Ctrl+C to copy')}
}

app.addEventListener('input',e=>{
  const t=e.target;
  if(t.id==='q'){ui.q=t.value;renderRows();return}
  if(t.id==='hq'){ui.hq=t.value;renderHistRows();return}
  if(t.dataset.td!==undefined&&cur){const x=tdList()[+t.dataset.td];if(x){x.text=t.value;save()}return}
  if(!cur){ // commands page
    const d=state.defaults;
    if(t.dataset.gv!==undefined){const x=gVar(t.dataset.gv);if(x){x.value=t.value;save()}return}
    if(t.dataset.dv!==undefined){const x=defVar(t.dataset.dv);if(x){x.value=t.value;save()}return}
    if(t.dataset.dll!==undefined){d.links[+t.dataset.dll].label=t.value;save();return}
    if(t.dataset.dlu!==undefined){d.links[+t.dataset.dlu].url=t.value.trim();save();return}
    if(t.dataset.kf){const sel=location.hash.slice(9)||state.commands[0]?.id;const k=getCmd(sel);if(!k)return;k[t.dataset.kf]=t.value;save();updatePreview(k);renderCmdList(k.id)}
    return;
  }
  if(t.dataset.f){cur[t.dataset.f]=t.value;if(t.dataset.f==='autoClose'){cur.autoCloseSet=t.value?iso(new Date()):'';cur.ctSent=false;cur.cSent=false;if(!t.value)cur.autoClose='';}delete cur.sample;save();updateHead();refreshCmds();return}
  if(t.dataset.fv!==undefined){cur.fields[t.dataset.fv]=t.value;save();refreshCmds();updateVarTags();return}
});
app.addEventListener('change',e=>{
  const t=e.target;
  if(t.id==='set-hints'){setHints(t.checked);toast(t.checked?'Hints shown':'Hints hidden');return}
  if(t.dataset.dva!==undefined){const x=defVar(t.dataset.dva);if(x){x.auto=t.checked;save();toast(x.auto?`${x.key} added to every case`:`${x.key} is no longer on every case`)}return}
  if(t.dataset.dla!==undefined){const x=state.defaults.links[+t.dataset.dla];if(x){x.auto=t.checked;save();toast(x.auto?'Now a default link on every case':'No longer on every case. Pick it per case')}return}
  if(t.id==='link-pick'&&t.value&&cur){const id=t.value,l=state.defaults.links.find(x=>x.id===id);if(l){if(l.auto)cur.hiddenLinks=cur.hiddenLinks.filter(x=>x!==id);else if(!cur.linkIds.includes(id))cur.linkIds.push(id);ensureVars(cur);save();renderLinks();renderVars();refreshCmds();document.getElementById('link-pick')?.focus()}return}
  if(t.id==='var-pick'&&t.value&&cur){const k=t.value;addDefVar(cur,k);save();renderVars();refreshCmds();document.querySelector(`#vars .var[data-row="${CSS.escape(k)}"] input`)?.focus();return}
  if(t.id==='f-last'&&cur&&t.value){const before=cur.autoClose;lastCommChanged(cur);if(fuOnLastComm(cur))toast(`Follow up #${cur.fuCount} counted`);save();syncForm();const fa=document.getElementById('f-auto');if(fa)fa.value=cur.autoClose||'';updateHead();renderLog();if(before&&!cur.autoClose)toast('Auto-close cleared. Pick the next comm phase');return}
  if(t.id==='f-auto'&&cur){if(cur.autoClose&&/^\d{4}-\d{2}-\d{2}$/.test(cur.autoClose)){applyAuto(cur);autoLog(cur,`Auto-close set for ${fmtW(cur.autoClose)}`);save();syncForm();updateHead();renderLog();toast(`Phase set to ${cur.phase}, next comm ${fmt(cur.commDate)}`)}else{save();updateHead()}return}
  if(t.dataset.cell&&!cur){const row=t.closest('.lrow');const c=getCase(row.dataset.cid);if(!c)return;c[t.dataset.cell]=t.value;delete c.sample;if(t.dataset.cell==='lastComm'&&t.value){const before=c.autoClose;lastCommChanged(c);const fu=fuOnLastComm(c);row.querySelector('[data-cell=phase]').value=c.phase;row.querySelector('[data-cell=commDate]').value=c.commDate||'';if(before&&!c.autoClose)toast('Auto-close cleared. Pick the next comm phase');else if(fu)toast(`Follow up #${c.fuCount} counted`)}save();refreshRow(row,c);ui.dirty=true;if(t.tagName==='SELECT')resortSoon();return}
  if(t.id==='pin-sel'&&t.value){const id=t.value;if(cur.hiddenCmds.includes(id))cur.hiddenCmds=cur.hiddenCmds.filter(x=>x!==id);else cur.commands.push(id);ensureVars(cur);save();renderCmdSection();renderVars();return}
  if(t.id==='f-phase-sel'&&cur){
    cur.phase=t.value;delete cur.sample;save();updateHead();return;
  }
  if(t.dataset.dlu!==undefined||t.dataset.kf==='template'){const v=migTpl(t.value);if(v!==t.value){t.value=v;t.dispatchEvent(new Event('input',{bubbles:true}))}return}
  if(t.id==='k-auto'){const k=getCmd(location.hash.slice(9)||state.commands[0]?.id);if(k){k.auto=t.checked;save();renderCmdList(k.id);toast(k.auto?'Added to every case':'No longer a default')}return}
});
app.addEventListener('keydown',e=>{
  if(e.key!=='Enter')return;
  const id=e.target.id;
  if(id==='log-in'){e.preventDefault();addLog()}
  else if(id==='td-new'){e.preventDefault();addTodo()}
  else if(id==='tag-in'){e.preventDefault();addTag()}
  else if(id==='link-url'||id==='link-label'){e.preventDefault();addLink()}
  else if(id==='var-new'){e.preventDefault();addVar()}
  else if(id==='dvar-new'){e.preventDefault();addDVar()}
  else if(id==='gvar-new'){e.preventDefault();addGVar()}
  else if(id==='dl-new-url'||id==='dl-new-label'){e.preventDefault();document.querySelector('[data-act="add-dlink"]').click()}
});
document.addEventListener('click',e=>{
  const b=e.target.closest('[data-act]');
  if(!b){const row=e.target.closest('.lrow[data-href]');if(row&&!e.target.closest('input,select,button,a,label'))location.hash=row.dataset.href;return}
  const a=b.dataset.act,i=+b.dataset.i;
  switch(a){
    case 'lay-mv':if(!b.disabled)moveLayout(b.dataset.p,b.dataset.d);break;
    case 'lay-reset':setLayout(LAYOUT0);renderLayout();toast('Layout reset');break;
    case 'td-add':addTodo();break;
    case 'td-cycle':{const x=tdList()[i];if(!x)break;x.s=(e.shiftKey?TD_PREV:TD_NEXT)[x.s]||' ';save();renderTodos(i);break}
    case 'td-del':tdList().splice(i,1);save();renderTodos();break;
    case 'td-clear':{const l=tdList(),n=l.length;l.splice(0,n,...l.filter(t=>t.s===' '||t.s==='-'));save();renderTodos();toast(`Cleared ${n-l.length}`);break}
    case 'new-case':{const c=norm({id:'c'+uid(),number:'',name:'',phase:'',commDate:'',lastComm:iso(new Date()),notes:''});autoLog(c,'Case created');state.cases.push(c);save();location.hash='case-'+c.id;setTimeout(()=>document.getElementById('f-number')?.focus(),0);break}
    case 'clear-samples':state.cases=state.cases.filter(c=>!c.sample);state.archive=state.archive.filter(a=>!a.sample);if(!state.cases.length&&state.sample){state.commands=[];state.defaults={vars:[],links:[]};state.globals=[];delete state.sample}save();route();toast('Examples removed');break;
    case 'pick-tag':if(!cur.tags.includes(b.dataset.t))cur.tags.push(b.dataset.t);save();renderTags();break;
    case 'hide-link':{const id=b.dataset.k;if(cur.linkIds.includes(id))cur.linkIds=cur.linkIds.filter(x=>x!==id);else if(!cur.hiddenLinks.includes(id))cur.hiddenLinks.push(id);save();renderLinks();renderVars();break}
    case 'unhide-links':cur.hiddenLinks=cur.hiddenLinks.filter(id=>!state.defaults.links.some(l=>l.id===id&&l.auto));ensureVars(cur);save();renderLinks();renderVars();break;
    case 'add-dlink':{const L=document.getElementById('dl-new-label'),U=document.getElementById('dl-new-url');let url=migTpl(U.value.trim());if(!url){toast('Add an address first');U.focus();break}if(!/^[a-z]+:\/\//i.test(url))url='https://'+url;const A=document.getElementById('dl-new-auto');state.defaults.links.push({id:'l'+uid(),label:L.value.trim(),url,auto:A.checked});toast(A.checked?'Link added to every case':'Link added. Pick it on the cases that need it');L.value='';U.value='';A.checked=false;save();renderDefaults();break}
    case 'del-dlink':{const [gone]=state.defaults.links.splice(i,1);if(gone)state.cases.forEach(c=>{c.linkIds=c.linkIds.filter(x=>x!==gone.id);c.hiddenLinks=c.hiddenLinks.filter(x=>x!==gone.id)});ui.editLink=null;save();renderDefaults();break}
    case 'dl-edit':ui.editLink=b.dataset.id;renderDefaults();document.querySelector('.dl-item.editing input')?.focus();break;
    case 'dl-done':ui.editLink=null;renderDefaults();break;
    case 'add-log':addLog();break;
    case 'del-log':cur.log.splice(i,1);save();renderLog();break;
    case 'add-tag':addTag();break;
    case 'del-tag':cur.tags.splice(i,1);save();renderTags();break;
    case 'add-link':addLink();break;
    case 'del-link':cur.links.splice(+b.dataset.k,1);save();renderLinks();renderVars();break;
    case 'add-var':addVar();break;
    case 'del-field':delete cur.fields[b.dataset.k];save();renderVars();refreshCmds();break;
    case 'del-dfield':removeDefVar(cur,b.dataset.k);save();renderVars();refreshCmds();toast(`${b.dataset.k} removed from this case`);break;
    case 'copy-var':{const k=b.dataset.k;const v=gVar(k)&&(cur||b.closest('#gvars'))?gVar(k).value:cur?caseVal(cur,k):(defVar(k)?.value||'');if(!v){toast(`${k} is empty`);break}copyText(v,b.closest('.var').querySelector('input'));break}
    case 'goto-var':{const r=document.querySelector(`#vars .var[data-row="${CSS.escape(b.dataset.k)}"] input`);if(r){r.scrollIntoView({block:'center',behavior:matchMedia('(prefers-reduced-motion: reduce)').matches?'auto':'smooth'});r.focus({preventScroll:true})}break}
    case 'add-dvar':addDVar();break;
    case 'del-dvar':{const k=b.dataset.k;state.defaults.vars=state.defaults.vars.filter(v=>v.key!==k);state.cases.forEach(c=>c.hiddenVars=c.hiddenVars.filter(x=>x!==k));save();renderBank();break}
    case 'add-gvar':addGVar();break;
    case 'del-gvar':state.globals=state.globals.filter(v=>v.key!==b.dataset.k);save();renderBank();break;
    case 'unpin':{const id=b.dataset.id;cur.commands=cur.commands.filter(x=>x!==id);if(getCmd(id)?.auto&&!cur.hiddenCmds.includes(id))cur.hiddenCmds.push(id);save();renderCmdSection();renderVars();break}
    case 'copy':{const k=getCmd(b.dataset.id);const r=fill(k.template,cur);copyText(r.text,b.closest('.cmd').querySelector('code'));break}
    case 'del-case':document.getElementById('del-zone').innerHTML=`<span class="sub">Delete this case and its log?</span><span class="inline-add"><button class="btn sm" data-act="del-cancel">Keep</button><button class="btn sm danger solid" data-act="del-case-yes">Delete</button></span>`;break;
    case 'del-cancel':document.getElementById('del-zone').innerHTML=`<span></span><button class="btn sm danger" data-act="del-case">Delete case</button>`;break;
    case 'del-case-yes':state.cases=state.cases.filter(c=>c!==cur);save();location.hash='home';toast('Case deleted');break;
    case 'copy-num':if(b.dataset.v)copyText(b.dataset.v,b);break;
    case 'cx':{const n=+b.dataset.n;cur.complexity=n;save();document.querySelectorAll('.cx [data-act=cx]').forEach(x=>{x.setAttribute('aria-checked',x===b);x.classList.toggle('on',+x.dataset.n<=n)});break}
    case 'fu-sent':{
      if(cur){markFU(cur);save();syncForm();updateHead();renderLog();toast(`Follow up #${cur.fuCount} sent`)}
      else{const c=getCase(b.dataset.id);if(!c)break;markFU(c);save();const row=b.closest('.lrow');row.querySelector('[data-cell=lastComm]').value=c.lastComm;row.querySelector('[data-cell=phase]').value=c.phase;row.querySelector('[data-cell=commDate]').value='';refreshRow(row,c);ui.dirty=true;resortSoon();toast(`Follow up #${c.fuCount} sent`)}
      break}
    case 'ac-sent':{cur.lastComm=iso(new Date());cur.ctSent=true;cur.phase='Closing';cur.commDate=cur.autoClose;autoLog(cur,'Closing tomorrow email sent');save();syncForm();updateHead();renderLog();toast('Closing '+fmtW(cur.autoClose));break}
    case 'ac-closed':{cur.lastComm=iso(new Date());cur.cSent=true;autoLog(cur,'Closing email sent');save();syncForm();updateHead();renderLog();toast('Closing email sent. Close the case when ready');break}
    case 'ac-keep':cur.autoCloseSet=cur.lastComm||iso(new Date());applyAuto(cur);save();syncForm();updateHead();toast('Auto-close back on');break;
    case 'close-case':cur.closedAt=iso(new Date());autoLog(cur,'Case closed');archiveUpsert(cur);save();updateHead();renderLog();toast('Case closed');break;
    case 'reopen':delete cur.closedAt;autoLog(cur,'Case reopened');archiveReopen(cur);save();updateHead();renderLog();toast('Case reopened');break;
    case 'crow-del':{const row=b.closest('.crow');row.querySelector('.crow-end').innerHTML=`<span class="left">Delete for good?</span><button class="btn sm" data-act="crow-keep">Keep</button><button class="btn sm danger solid" data-act="crow-del-yes" data-id="${b.dataset.id}">Delete</button>`;break}
    case 'crow-keep':renderRows();break;
    case 'crow-del-yes':state.cases=state.cases.filter(c=>c.id!==b.dataset.id);save();renderRows();toast('Case deleted');break;
    case 'new-cmd':{const k={id:'k'+uid(),name:'',template:''};state.commands.push(k);save();location.hash='command-'+k.id;setTimeout(()=>document.getElementById('k-name')?.focus(),0);break}
    case 'del-cmd':document.getElementById('kdel').innerHTML=`<span class="sub">This also removes it from every case.</span><span class="inline-add"><button class="btn sm" data-act="cmd-keep">Keep</button><button class="btn sm danger solid" data-act="del-cmd-yes" data-id="${b.dataset.id}">Delete</button></span>`;break;
    case 'cmd-keep':route();break;
    case 'del-cmd-yes':{const id=b.dataset.id;state.commands=state.commands.filter(k=>k.id!==id);state.cases.forEach(c=>c.commands=c.commands.filter(x=>x!==id));save();location.hash='commands';route();toast('Command deleted');break}
    case 'export':copyText(JSON.stringify(state,null,2),document.getElementById('import-box'));break;
    case 'import':document.getElementById('import-actions').innerHTML=`<button class="btn sm" data-act="import-no">Cancel</button><button class="btn sm danger solid" data-act="import-yes">Replace all data</button>`;break;
    case 'import-no':document.getElementById('import-actions').innerHTML=`<button class="btn sm" data-act="import">Replace data with this</button>`;break;
    case 'import-yes':{
      try{const d=JSON.parse(document.getElementById('import-box').value);if(!Array.isArray(d.cases)||!Array.isArray(d.commands))throw 0;state=normState(d);sync.snapshot=true;save();document.getElementById('import-box').value='';toast('Data restored');route()}
      catch(err){toast('That text is not a Comm Desk backup')}
      document.getElementById('import-actions').innerHTML=`<button class="btn sm" data-act="import">Replace data with this</button>`;break}
    case 'sync-retry':if(sync.dirty&&!sync.inflight&&!sync.conflict)flush();break;
    case 'sync-theirs':useTheirs();break;
    case 'sync-mine':useMine();break;
    case 'boot-retry':boot();break;
    case 'logout':(async()=>{
      await flush();
      if(sync.dirty){toast('Some changes aren’t saved yet. Try again in a moment');return}
      try{await api('POST','/api/logout')}catch(e){}
      location.href='/login';
    })();break;
  }
});

window.addEventListener('hashchange',()=>{if(state)route()});
boot();
})();
</script>

</body></html>
