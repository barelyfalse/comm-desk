<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Sign in · Comm Desk</title>
<link rel="icon" href="/static/icon.svg" type="image/svg+xml">
<style>
@font-face{font-family:"Public Sans";font-style:normal;font-display:swap;font-weight:100 900;src:url(/static/fonts/public-sans-latin.woff2) format("woff2")}
:root{
  --bg:#f1f3f7; --surface:#ffffff; --surface-2:#f7f8fb; --line:#dce0e8; --line-strong:#c5cbd6;
  --fg:#151a24; --muted:#5b6476; --accent:#2b4fd8; --accent-fg:#ffffff; --over:#c33a2a; --over-soft:#fbe8e5; --tmrw:#8f7400;
  color-scheme:light;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0e1218; --surface:#151a23; --surface-2:#1a2030; --line:#252c3a; --line-strong:#343d4f;
  --fg:#e5e8ee; --muted:#9aa2b3; --accent:#7f9cff; --accent-fg:#0b1020; --over:#ff7c6c; --over-soft:#3a1c19; --tmrw:#e4c64a;
  color-scheme:dark}}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;display:grid;place-items:center;padding:16px;background:var(--bg);color:var(--fg);
  font:14px/1.45 "Public Sans",system-ui,-apple-system,"Segoe UI",sans-serif}
form{width:100%;max-width:340px;background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:24px;display:flex;flex-direction:column;gap:14px}
.brand{display:flex;align-items:center;gap:8px;font-weight:700;font-size:17px;letter-spacing:-.01em}
.brand svg{width:24px;height:24px}
.brand .lg-b{fill:var(--accent)} .brand .lg-l{stroke:var(--accent-fg)} .brand .lg-d{fill:var(--tmrw)}
label{display:flex;flex-direction:column;gap:4px;font-size:12px;color:var(--muted);font-weight:500}
input{font:inherit;font-size:15px;color:inherit;width:100%;border:1px solid var(--line);background:var(--surface-2);border-radius:6px;padding:8px 10px}
input:focus{border-color:var(--accent);outline:none;background:var(--surface)}
button{font:inherit;font-weight:600;border:1px solid var(--accent);background:var(--accent);color:var(--accent-fg);border-radius:6px;padding:9px 12px;cursor:pointer}
button:disabled{opacity:.6;cursor:default}
button:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.err{margin:0;font-size:13px;color:var(--over);background:var(--over-soft);border-radius:6px;padding:7px 10px}
.hint{margin:0;font-size:12px;color:var(--muted)}
</style>
</head>
<body>
<form id="f">
  <div class="brand"><svg viewBox="0 0 24 24" aria-hidden="true"><path class="lg-b" d="M5 3.5h12a3 3 0 0 1 3 3v7.5a3 3 0 0 1-3 3h-6.2L6.4 20.6a.6.6 0 0 1-1-.45V17A3 3 0 0 1 2 14V6.5a3 3 0 0 1 3-3Z"/><path class="lg-l" d="M6.5 8.5h7M6.5 12h4.5" fill="none" stroke-width="1.8" stroke-linecap="round"/><circle class="lg-d" cx="19.5" cy="4.5" r="3"/></svg>Comm Desk</div>
  <label>Password<input type="password" id="pw" autocomplete="current-password" required autofocus></label>
  <p class="err" id="err" role="alert" hidden></p>
  <button id="go">Sign in</button>
  <p class="hint">Stays signed in for 24 hours.</p>
</form>
<script>
const f=document.getElementById('f'),pw=document.getElementById('pw'),err=document.getElementById('err'),go=document.getElementById('go');
f.addEventListener('submit',async e=>{
  e.preventDefault();go.disabled=true;err.hidden=true;
  try{
    const r=await fetch('/api/login',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({password:pw.value}),credentials:'same-origin'});
    if(r.ok){location.replace('/');return}
    err.textContent=r.status===401?'Wrong password.':r.status===429?'Too many attempts. Wait a minute and try again.':'Sign-in failed. Try again.';
  }catch(_){err.textContent='Can’t reach the server.'}
  err.hidden=false;go.disabled=false;pw.select();
});
</script>
</body>
</html>
